<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lovci větných členů</title>
<style>
:root{--bg1:#140b2e;--bg2:#30124f;--card:#fffdf7;--ink:#191422;--gold:#ffd166;--tile:#f6e7bd;--tile2:#ffd36d;--green:#1fbf75;--red:#e84855;}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--card);background:radial-gradient(circle at 20% 15%,rgba(255,209,102,.22),transparent 26%),radial-gradient(circle at 80% 10%,rgba(76,201,240,.18),transparent 26%),linear-gradient(135deg,var(--bg1),var(--bg2) 55%,#0b132b);overflow-x:hidden}
.wrap{width:min(980px,100%);margin:0 auto;padding:16px} .screen{display:none;min-height:100vh;align-items:center;justify-content:center} .screen.active{display:flex}
.panel{width:100%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:26px;box-shadow:0 18px 60px rgba(0,0,0,.35);padding:20px;backdrop-filter:blur(8px)}
h1{font-size:clamp(34px,7vw,66px);margin:0 0 8px;text-align:center;color:var(--gold);letter-spacing:.5px} .sub{text-align:center;font-size:clamp(17px,3vw,24px);margin:0 auto 18px;max-width:760px;line-height:1.35}
.menuBtns{display:grid;gap:14px;max-width:560px;margin:22px auto 0} button{border:0;border-radius:18px;cursor:pointer;font-weight:900;letter-spacing:.4px;box-shadow:0 8px 0 rgba(0,0,0,.22),0 16px 22px rgba(0,0,0,.20);transition:transform .08s ease,filter .15s ease,background .2s ease}
button:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.24),0 8px 18px rgba(0,0,0,.18)} .bigBtn{padding:18px 20px;font-size:clamp(20px,4vw,30px);color:#24160b;background:linear-gradient(#ffe29b,#ffb703)} .smallBtn{padding:10px 14px;font-size:15px;color:#1a1630;background:#f8f4e3;box-shadow:none}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px} .badge{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);padding:8px 10px;border-radius:14px;font-weight:800}
.sentence{background:var(--card);color:var(--ink);border-radius:24px;padding:18px 16px;font-size:clamp(24px,5.7vw,40px);line-height:1.36;text-align:center;font-weight:650;box-shadow:inset 0 0 0 3px rgba(255,209,102,.55);min-height:135px;display:flex;align-items:center;justify-content:center}
strong{display:inline-block;padding:0 .22em;margin:0 .10em;border-bottom:.16em solid #e84855;background:rgba(255,209,102,.42);border-radius:.2em;font-weight:950}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px} .tile{min-height:58px;padding:10px 8px;font-size:clamp(14px,3.1vw,20px);color:#22160b;background:linear-gradient(180deg,var(--tile),var(--tile2));border:2px solid rgba(255,255,255,.65)}
.tile.correct{background:linear-gradient(180deg,#6ee7a8,var(--green));color:white;animation:pop .36s ease} .tile.wrong{background:linear-gradient(180deg,#ff9aa2,var(--red));color:white;animation:shake .35s ease} .tile.dim{filter:brightness(.78) saturate(.8);opacity:.72}
.feedback{min-height:52px;margin-top:12px;text-align:center;font-size:clamp(28px,7vw,50px);font-weight:1000;letter-spacing:1px} .feedback.good{color:#7CFFB2;text-shadow:0 0 18px rgba(31,191,117,.7)} .feedback.bad{color:#ff8b94;text-shadow:0 0 18px rgba(232,72,85,.75)} .hint{text-align:center;font-size:16px;opacity:.88;margin-top:4px;min-height:22px} .result{text-align:center} .result .grade{font-size:clamp(38px,10vw,82px);color:var(--gold);font-weight:1000;margin:8px 0}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}} @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}} @media (max-width:430px){.wrap{padding:10px}.panel{padding:13px;border-radius:20px}.sentence{min-height:128px;padding:14px 11px}.tiles{gap:7px}.tile{min-height:48px;padding:7px 5px}.topbar{font-size:14px}}
</style>
</head>
<body>
<section id="menu" class="screen active"><div class="wrap"><div class="panel"><h1>Lovci větných členů</h1><p class="sub">Urči přesně zvýrazněný větný člen. Pozor na doplněk, přívlastek a druhy příslovečných určení.</p><div class="menuBtns"><button class="bigBtn" onclick="startGame('train')">TRÉNINK</button><button class="bigBtn" onclick="startGame('test')">NAOSTRO</button></div><p class="hint">NAOSTRO: získej 10 správných odpovědí za sebou.</p></div></div></section>
<section id="game" class="screen"><div class="wrap"><div class="panel"><div class="topbar"><span class="badge" id="modeBadge">TRÉNINK</span><span class="badge">Série: <span id="streak">0</span>/10</span><button class="smallBtn" onclick="backToMenu()">MENU</button></div><div class="sentence" id="sentence"></div><div class="tiles" id="tiles"></div><div id="feedback" class="feedback"></div><div id="hint" class="hint"></div></div></div></section>
<section id="result" class="screen"><div class="wrap"><div class="panel result"><h1>Hotovo!</h1><div class="grade">MÁŠ JEDNIČKU</div><p class="sub">Zvládl/a jsi 10 správných odpovědí za sebou.</p><button class="bigBtn" onclick="startGame('test')">HRÁT ZNOVU</button><button class="bigBtn" onclick="backToMenu()" style="margin-top:12px;">MENU</button></div></div></section>
<script>
const QUESTIONS=[{"sentence":"Po dlouhé poradě zůstalo rozhodnutí <strong>nejasné</strong>.","answer":"DOPLNĚK"},{"sentence":"Odpověď se mu zdála <strong>přesvědčivá</strong>.","answer":"DOPLNĚK"},{"sentence":"Do sálu vstoupil řečník <strong>rozladěn</strong>.","answer":"DOPLNĚK"},{"sentence":"Porota označila jeho výkon <strong>za mimořádný</strong>.","answer":"DOPLNĚK"},{"sentence":"Z jednání se vrátil <strong>unavený</strong>.","answer":"DOPLNĚK"},{"sentence":"Považovali tento postup <strong>za riskantní</strong>.","answer":"DOPLNĚK"},{"sentence":"Dívka seděla u okna <strong>zamyšlená</strong>.","answer":"DOPLNĚK"},{"sentence":"Našli jsme dveře <strong>pootevřené</strong>.","answer":"DOPLNĚK"},{"sentence":"Po nepříjemném rozhovoru se cítil <strong>ponížený</strong>.","answer":"DOPLNĚK"},{"sentence":"Text se studentům zdál <strong>nesrozumitelný</strong>.","answer":"DOPLNĚK"},{"sentence":"Doběhl do cíle <strong>poslední</strong>.","answer":"DOPLNĚK"},{"sentence":"Svědka našli policisté <strong>živého</strong>.","answer":"DOPLNĚK"},{"sentence":"Včerejší bouře poničila <strong>střechu</strong>.","answer":"PŘEDMĚT"},{"sentence":"Nikdo si nevšiml <strong>detailu</strong>.","answer":"PŘEDMĚT"},{"sentence":"Učitel se vyhnul <strong>odpovědi</strong>.","answer":"PŘEDMĚT"},{"sentence":"Turisté obdivovali <strong>výhled</strong>.","answer":"PŘEDMĚT"},{"sentence":"Obával se <strong>zdržení</strong>.","answer":"PŘEDMĚT"},{"sentence":"Komise projednala <strong>námitky</strong>.","answer":"PŘEDMĚT"},{"sentence":"Děti se smály <strong>vysvětlení</strong>.","answer":"PŘEDMĚT"},{"sentence":"Lékař doporučil pacientovi <strong>odpočinek</strong>.","answer":"PŘEDMĚT"},{"sentence":"Nikdy nezapomněl <strong>na radu</strong>.","answer":"PŘEDMĚT"},{"sentence":"Zpráva se týkala <strong>změny</strong>.","answer":"PŘEDMĚT"},{"sentence":"Nikdo nepochyboval <strong>o poctivosti</strong> svědka.","answer":"PŘEDMĚT"},{"sentence":"Reportér požádal svědka <strong>o popis</strong> události.","answer":"PŘEDMĚT"},{"sentence":"<strong>Cestující</strong> čekali na nádraží další hodinu.","answer":"PODMĚT"},{"sentence":"<strong>Návštěvníci</strong> opustili výstavu až po zavírací době.","answer":"PODMĚT"},{"sentence":"<strong>Rozhodnutí</strong> překvapilo i zkušené členy komise.","answer":"PODMĚT"},{"sentence":"<strong>Přiznat chybu</strong> bývá někdy těžší než ji napravit.","answer":"PODMĚT"},{"sentence":"<strong>Mlčet</strong> se v takové chvíli zdálo zbabělé.","answer":"PODMĚT"},{"sentence":"<strong>Kandidáti</strong> odmítli veřejnou debatu.","answer":"PODMĚT"},{"sentence":"<strong>Studenti</strong> z poslední lavice odpověděli správně.","answer":"PODMĚT"},{"sentence":"<strong>Rukopis</strong> nalezený v archivu zaujal historiky.","answer":"PODMĚT"},{"sentence":"Po návratu z cest <strong>byl málomluvný</strong>.","answer":"PŘÍSUDEK"},{"sentence":"Výsledky soutěže <strong>budou vyhlášeny</strong> zítra dopoledne.","answer":"PŘÍSUDEK"},{"sentence":"Jeho vysvětlení se ukázalo <strong>jako nedostatečné</strong>.","answer":"DOPLNĚK"},{"sentence":"Všichni účastníci <strong>museli odevzdat</strong> vyplněné formuláře.","answer":"PŘÍSUDEK"},{"sentence":"Starý most <strong>byl zpřístupněn</strong> veřejnosti.","answer":"PŘÍSUDEK"},{"sentence":"Ten nápad <strong>nemusel být špatný</strong>.","answer":"PŘÍSUDEK"},{"sentence":"Obloha nad městem <strong>se začala zatahovat</strong>.","answer":"PŘÍSUDEK"},{"sentence":"Výklad <strong>by se byl protáhl</strong> až do večera.","answer":"PŘÍSUDEK"},{"sentence":"Mladý herec <strong>se stal symbolem</strong> celé generace.","answer":"PŘÍSUDEK"},{"sentence":"Odpověď <strong>nebyla přesná</strong>.","answer":"PŘÍSUDEK"},{"sentence":"Dům <strong>s balkonem</strong> stojí na rohu náměstí.","answer":"PŘÍVLASTEK"},{"sentence":"Rozhovor přinesl <strong>nečekané</strong> souvislosti.","answer":"PŘÍVLASTEK"},{"sentence":"Uprostřed náměstí stála socha <strong>vojáka</strong>.","answer":"PŘÍVLASTEK"},{"sentence":"Vzpomínka <strong>na mládí</strong> ho náhle dojala.","answer":"PŘÍVLASTEK"},{"sentence":"Přinesl článek <strong>otištěný</strong> v regionálním tisku.","answer":"PŘÍVLASTEK"},{"sentence":"Na výstavě visel obraz <strong>plný</strong> tlumených barev.","answer":"PŘÍVLASTEK"},{"sentence":"Jejich plán <strong>na řešení</strong> krize selhal.","answer":"PŘÍVLASTEK"},{"sentence":"Knihy <strong>bez obalu</strong> ležely na stole.","answer":"PŘÍVLASTEK"},{"sentence":"Mluvili jsme o rozhodnutí <strong>přijatém</strong> jednomyslně.","answer":"PŘÍVLASTEK"},{"sentence":"Na stole zůstal dopis <strong>od přítele</strong>.","answer":"PŘÍVLASTEK"},{"sentence":"Přednáška <strong>o baroku</strong> studenty překvapivě zaujala.","answer":"PŘÍVLASTEK"},{"sentence":"Návrh <strong>na změnu</strong> pravidel vyvolal spor.","answer":"PŘÍVLASTEK"},{"sentence":"Odešel <strong>včera večer</strong> bez rozloučení.","answer":"PU ČASU"},{"sentence":"Vrátí se <strong>za hodinu</strong>.","answer":"PU ČASU"},{"sentence":"Na rozhodnutí čekal <strong>celý den</strong>.","answer":"PU ČASU"},{"sentence":"Přijde <strong>po zkoušce</strong>.","answer":"PU ČASU"},{"sentence":"Na cestu se vydali <strong>hned ráno</strong>.","answer":"PU ČASU"},{"sentence":"Seděl <strong>u okna</strong> a pozoroval ulici.","answer":"PU MÍSTA"},{"sentence":"Stál <strong>před domem</strong>.","answer":"PU MÍSTA"},{"sentence":"Děti se schovaly <strong>pod mostem</strong>.","answer":"PU MÍSTA"},{"sentence":"Kniha leží <strong>na stole</strong>.","answer":"PU MÍSTA"},{"sentence":"Setkali se <strong>ve městě</strong>.","answer":"PU MÍSTA"},{"sentence":"Odpověděl <strong>bez rozmýšlení</strong>.","answer":"PU ZPŮSOBU"},{"sentence":"Mluvil <strong>tiše</strong>.","answer":"PU ZPŮSOBU"},{"sentence":"Jednal <strong>uvážlivě</strong>.","answer":"PU ZPŮSOBU"},{"sentence":"Student pracoval <strong>soustředěně</strong>.","answer":"PU ZPŮSOBU"},{"sentence":"Své stanovisko vysvětlil překvapivě <strong>s jistotou</strong>.","answer":"PU ZPŮSOBU"},{"sentence":"Zůstal doma <strong>kvůli nemoci</strong>.","answer":"PU PŘÍČINY"},{"sentence":"Neuspěl <strong>pro nedostatek času</strong>.","answer":"PU PŘÍČINY"},{"sentence":"Odešel <strong>ze strachu</strong> před následky.","answer":"PU PŘÍČINY"},{"sentence":"Mlčel <strong>z opatrnosti</strong>.","answer":"PU PŘÍČINY"},{"sentence":"Zastavil se <strong>z únavy</strong>.","answer":"PU PŘÍČINY"},{"sentence":"Přišel za účelem <strong>jednání</strong>.","answer":"PŘÍVLASTEK"},{"sentence":"Šel tam <strong>pro pomoc</strong>.","answer":"PU ÚČELU"},{"sentence":"Učil se <strong>kvůli zkoušce</strong>.","answer":"PU ÚČELU"},{"sentence":"Vrátil se <strong>pro knihu</strong>.","answer":"PU ÚČELU"},{"sentence":"Odešel <strong>na nákup</strong>.","answer":"PU ÚČELU"},{"sentence":"<strong>Bez pomoci</strong> by úkol nezvládl.","answer":"PU PODMÍNKY"},{"sentence":"<strong>Při dostatku času</strong> by pracoval pečlivěji.","answer":"PU PODMÍNKY"},{"sentence":"<strong>V případě nehody</strong> zavolejte okamžitě záchrannou službu.","answer":"PU PODMÍNKY"},{"sentence":"<strong>Bez přípravy</strong> by odpověď neobhájil.","answer":"PU PODMÍNKY"},{"sentence":"<strong>Za příznivého počasí</strong> vyrazíme na cestu.","answer":"PU PODMÍNKY"},{"sentence":"Přišel <strong>navzdory dešti</strong>.","answer":"PU PŘÍPUSTKY"},{"sentence":"Uspěl <strong>přes obtíže</strong>.","answer":"PU PŘÍPUSTKY"},{"sentence":"Pokračoval <strong>i přes únavu</strong>.","answer":"PU PŘÍPUSTKY"},{"sentence":"Odešel <strong>navzdory varování</strong>.","answer":"PU PŘÍPUSTKY"},{"sentence":"<strong>I přes překážky</strong> práci dokončil.","answer":"PU PŘÍPUSTKY"},{"sentence":"Pracoval <strong>velmi</strong> rychle.","answer":"PU MÍRY"},{"sentence":"Byl <strong>zcela</strong> vyčerpaný.","answer":"PU MÍRY"},{"sentence":"Mluvil <strong>příliš</strong> hlasitě.","answer":"PU MÍRY"},{"sentence":"Reagoval naprosto <strong>klidně</strong>.","answer":"PU ZPŮSOBU"},{"sentence":"Výsledek ho <strong>velmi</strong> překvapil.","answer":"PU MÍRY"},{"sentence":"Zastavil se <strong>na okamžik</strong> u výlohy.","answer":"PU ČASU"},{"sentence":"Rozhovor pokračoval <strong>v kabinetě</strong>.","answer":"PU MÍSTA"},{"sentence":"Na kritiku reagoval <strong>s nečekaným klidem</strong>.","answer":"PU ZPŮSOBU"},{"sentence":"Odpověď se opozdila technicky <strong>kvůli chybě</strong>.","answer":"PU PŘÍČINY"},{"sentence":"<strong>Odborníci</strong> posoudili návrh bez zbytečného odkladu.","answer":"PODMĚT"},{"sentence":"<strong>Vytrvat</strong> v obtížné situaci není samozřejmé.","answer":"PODMĚT"}];
const ANSWERS=["PODMĚT", "PŘÍSUDEK", "PŘEDMĚT", "PŘÍVLASTEK", "DOPLNĚK", "PU ČASU", "PU MÍSTA", "PU ZPŮSOBU", "PU PŘÍČINY", "PU ÚČELU", "PU PODMÍNKY", "PU PŘÍPUSTKY", "PU MÍRY"];
let mode="train",pool=[],current=null,locked=false,streak=0,audioCtx=null;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)()}
function tone(freq,duration,type="sine",gain=.12,delay=0){ensureAudio();const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(g).connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.02)}
function soundCorrect(){tone(620,.12,"triangle",.16,0);tone(880,.15,"triangle",.16,.10);tone(1240,.18,"triangle",.14,.22)}
function soundWrong(){tone(180,.22,"sawtooth",.18,0);tone(120,.24,"sawtooth",.16,.16)}
function soundWin(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.18,"triangle",.14,i*.11))}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function startGame(m){mode=m;streak=0;pool=shuffle(QUESTIONS);document.getElementById("modeBadge").textContent=mode==="train"?"TRÉNINK":"NAOSTRO";updateStreak();show("game");nextQuestion()}
function backToMenu(){show("menu")}
function updateStreak(){document.getElementById("streak").textContent=streak}
function nextQuestion(){locked=false;document.getElementById("feedback").textContent="";document.getElementById("feedback").className="feedback";document.getElementById("hint").textContent="";if(pool.length===0)pool=shuffle(QUESTIONS);current=pool.pop();document.getElementById("sentence").innerHTML=current.sentence;const tiles=document.getElementById("tiles");tiles.innerHTML="";ANSWERS.forEach(ans=>{const b=document.createElement("button");b.className="tile";b.textContent=ans;b.onclick=()=>choose(ans,b);tiles.appendChild(b)})}
function choose(ans,btn){if(locked)return;locked=true;const ok=ans===current.answer,buttons=[...document.querySelectorAll(".tile")];buttons.forEach(b=>{if(b.textContent===current.answer)b.classList.add("correct");else if(b===btn)b.classList.add("wrong");else b.classList.add("dim")});const fb=document.getElementById("feedback");if(ok){streak++;updateStreak();fb.textContent="SPRÁVNĚ";fb.className="feedback good";soundCorrect();if(mode==="test"&&streak>=10){setTimeout(()=>{soundWin();show("result")},850);return}setTimeout(nextQuestion,1200)}else{streak=0;updateStreak();fb.textContent="CHYBA";fb.className="feedback bad";document.getElementById("hint").textContent="Správně: "+current.answer+" – klikni kamkoli mimo dlaždice.";soundWrong();document.body.addEventListener("click",advanceAfterWrong,true)}}
function advanceAfterWrong(e){if(e.target.classList&&e.target.classList.contains("tile"))return;document.body.removeEventListener("click",advanceAfterWrong,true);nextQuestion()}
</script>
</body>
</html>
